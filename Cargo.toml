[package]
name = "api-example"
version = "0.1.0"
edition = "2024"

[lints.clippy]
unwrap_used = "deny"
# Prefer saturating_* methods for integer arithmetic.
arithmetic_side_effects = "deny"
implicit_saturating_add = "deny"
implicit_saturating_sub = "deny"
manual_saturating_arithmetic = "deny"

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "derive", "migrate", "macros", "postgres", "tls-rustls"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tower-sessions = "0.15.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = { version = "6.0.0", features = ["axum_extras"] }
utoipa-axum = "0.3.0"

[dev-dependencies]
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
serde_json = "1.0.154"
tower = { version = "0.5.3", features = ["util"] }
